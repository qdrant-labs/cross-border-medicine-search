<text x="60" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#e6e9f2" text-anchor="start" font-weight="700">Matryoshka embeddings in this project</text>
<text x="60" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#767d96" text-anchor="start" font-weight="400">Cross-border medicine lookup · 5,298 products from the Polish, Spanish and Dutch registries · every number below is measured, not quoted</text>
<line x1="60" y1="104" x2="1540" y2="104" stroke="#1c2030"/>
<circle cx="69" cy="143" r="9" fill="#262c40"/><text x="69" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#767d96" text-anchor="middle" font-weight="600">1</text><text x="86" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#e6e9f2" text-anchor="start" font-weight="600">One vector. The first N dimensions are already an embedding.</text>
<text x="86" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#767d96" text-anchor="start" font-weight="400">Matryoshka Representation Learning trains the prefixes to stand alone, so truncating is a slice and a renormalise — not a projection, not a second model.</text>
