<text x="86" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#767d96" text-anchor="start" font-weight="400">5,298 registry records, Polish query → Spanish shelf. Each model against its own full width, so the lines compare robustness to truncation, not raw quality.</text>
