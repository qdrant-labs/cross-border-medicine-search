<text x="1166" y="870" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6e9f2" text-anchor="start" font-weight="400">624 KB total</text>
<text x="1166" y="892" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a5169" text-anchor="start" font-weight="400">a normal web asset</text>
<rect x="86" y="942" width="1428" height="58" rx="7" fill="#0b1410" stroke="#1d4c38" stroke-width="1"/>
<text x="108" y="967" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#3ddc97" text-anchor="start" font-weight="600">So the last panel of the demo turns the server off.</text>
<text x="108" y="987" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#767d96" text-anchor="start" font-weight="400">The browser fetches 624 KB of vectors, encodes the query with bekko's ONNX build, applies the same α=0.75 SHIFT offset, and scans all 1,248 products — encode included — in 66–156 ms warm.</text>
<text x="86" y="1042" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4a5169" text-anchor="start" font-weight="400">Why two lines sit above 100%: this metric asks only whether Spanish records survived the top ten, so dropping dimensions partly does SHIFT's job for it. On recall_atc — was the right molecule found at all — the curve is flat (99.4% → 99.2% for bekko at 64d). Truncation is cheap here; it is not free everywhere.</text>
<text x="86" y="1062" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4a5169" text-anchor="start" font-weight="400">Arctic falls off below 256d because that is where Snowflake stopped training the objective — MRL is not magic past its trained range. Source: src/med/matryoshka.py, artifacts/med/matryoshka.json.</text>
</svg>